<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 게임 점수판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#243347;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1440px;margin:40px auto;padding:0 24px}h1{font-size:26px;margin:0 0 8px}p{color:#6b7788;font-size:14px;margin:0 0 24px}.sheet{overflow:auto;background:white;border:1px solid #e0e5ec;border-radius:14px}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1150px}th{padding:18px 12px;background:#f0f4f9;font-size:15px;white-space:nowrap}td{padding:16px 10px;text-align:center;border-top:1px solid #e8edf3}th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:#fff;border-right:1px solid #e8edf3}th:first-child{background:#f0f4f9}input,button{font:inherit}input{border:1px solid #d5dde8;border-radius:8px;padding:10px;text-align:center;background:#fff;color:#243347}input:focus{outline:2px solid #83adeb;outline-offset:1px}.name{width:130px;text-align:left}.score{width:94px;font-size:20px;font-weight:600;appearance:textfield}.score::-webkit-inner-spin-button,.score::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.controls{display:flex;justify-content:center;gap:4px;margin-top:7px}button{border:1px solid #d8e1ed;background:#f4f7fb;color:#354961;border-radius:7px;cursor:pointer;padding:7px 11px}button:hover{background:#e5edf8}button:active{transform:translateY(1px)}.step{font-size:18px;width:29px;padding:3px 0}.joker{font-size:12px;color:#916326;background:#fff8eb;border-color:#eedebe;padding:5px 7px}.total{font-size:24px;font-weight:750;color:#326ac1;min-width:85px}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}#add{background:#326ac1;color:#fff;border:0;padding:11px 17px}#saved{font-size:12px;color:#7b8796}@media(max-width:700px){main{margin:24px auto;padding:0 12px}.name{width:100px}h1{font-size:23px}}
</style>
</head>
<body>
<main>
<h1>수학 게임 점수판</h1>
<p>이름과 점수를 입력하세요. + / − 는 1점씩, 조커는 해당 차시를 0점으로 만듭니다.</p>
<div class="sheet"><table aria-label="학생별 7차시 점수와 누적 점수"><thead><tr><th scope="col">이름</th><th scope="col">1차시</th><th scope="col">2차시</th><th scope="col">3차시</th><th scope="col">4차시</th><th scope="col">5차시</th><th scope="col">6차시</th><th scope="col">7차시</th><th scope="col">누적</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="footer"><button id="add" type="button">+ 학생 추가</button><span id="saved" role="status"></span></div>
</main>
<script>
'use strict';
const KEY='math-game-seven-v1';
const rows=document.getElementById('rows');
let students=[];
let storageProblem=false;
function blank(){return {name:'',scores:Array(7).fill(0)}}
function validStudent(s){return s&&typeof s.name==='string'&&Array.isArray(s.scores)&&s.scores.length===7&&s.scores.every(Number.isSafeInteger)}
try{
 const raw=localStorage.getItem(KEY);
 if(raw){const old=JSON.parse(raw);if(!Array.isArray(old.students)||!old.students.every(validStudent))throw Error('Invalid data');students=old.students;}
}catch(e){storageProblem=true;}
if(!students.length)students=Array.from({length:10},blank);
function save(){
 if(storageProblem){document.getElementById('saved').textContent='저장 기록을 읽지 못했습니다. 자동 저장이 중지되었습니다.';return;}
 try{localStorage.setItem(KEY,JSON.stringify({students}));document.getElementById('saved').textContent='자동 저장됨';}
 catch(e){document.getElementById('saved').textContent='자동 저장을 사용할 수 없습니다.';}
}
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function addRow(s){
 const tr=element('tr'),nameCell=element('td'),name=element('input');
 name.type='text';name.className='name';name.placeholder='이름 입력';name.maxLength=80;name.value=s.name;name.setAttribute('aria-label','학생 이름');
 name.addEventListener('input',()=>{s.name=name.value;save()});nameCell.append(name);tr.append(nameCell);
 const total=element('td');total.className='total';total.setAttribute('aria-label','누적 점수');
 function updateTotal(){total.textContent=s.scores.reduce((a,b)=>a+b,0)}
 s.scores.forEach((value,i)=>{
  const cell=element('td'),input=element('input');input.type='number';input.step='1';input.className='score';input.value=value;input.setAttribute('aria-label',(i+1)+'차시 점수');
  function setScore(n){if(!Number.isSafeInteger(n))return; s.scores[i]=n;input.value=n;updateTotal();save()}
  input.addEventListener('input',()=>{if(input.value.trim()!==''){const n=Number(input.value);if(Number.isSafeInteger(n)){s.scores[i]=n;updateTotal();save()}}});
  input.addEventListener('change',()=>{if(input.value.trim()==='')setScore(0);else if(!Number.isSafeInteger(Number(input.value)))input.value=s.scores[i]});
  const controls=element('div');controls.className='controls';
  const minus=element('button','−'),plus=element('button','+'),joker=element('button','조커');
  minus.className=plus.className='step';joker.className='joker';
  for(const b of [minus,plus,joker])b.type='button';
  minus.setAttribute('aria-label',(i+1)+'차시 1점 빼기');plus.setAttribute('aria-label',(i+1)+'차시 1점 더하기');joker.setAttribute('aria-label',(i+1)+'차시 0점으로 초기화');
  minus.addEventListener('click',()=>setScore(s.scores[i]-1));plus.addEventListener('click',()=>setScore(s.scores[i]+1));joker.addEventListener('click',()=>setScore(0));
  controls.append(minus,plus,joker);cell.append(input,controls);tr.append(cell);
 });
 updateTotal();tr.append(total);rows.append(tr);
}
students.forEach(addRow);
document.getElementById('add').addEventListener('click',()=>{const s=blank();students.push(s);addRow(s);save();rows.lastElementChild.querySelector('.name').focus()});
if(storageProblem)save();
</script>
</body>
</html>
